name: Build Upstream Nanobot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      - name: Add Nanobot runtime tools
        shell: bash
        run: |
          set -euo pipefail

          # Add Node 24 as an additional build stage.
          sed -i '1i FROM node:24-bookworm-slim AS node-runtime' Dockerfile

          # Add curl + GitHub CLI to the existing runtime packages.
          python3 <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          text = path.read_text()

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl gh"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line changed."
              )

          text = text.replace(original, replacement)

          # Insert our additions immediately before ENTRYPOINT.
          marker = "ENTRYPOINT"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not locate ENTRYPOINT in upstream Dockerfile."
              )

          additions = r'''
          # --- Custom runtime additions ---

          # Node.js 24 + npm/npx
          COPY --from=node-runtime /usr/local/ /usr/local/

          # Allow the unprivileged nanobot user to install global npm packages.
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global
          ENV PATH="/home/nanobot/.npm-global/bin:${PATH}"

          RUN mkdir -p /home/nanobot/.npm-global \
              && chown -R nanobot:nanobot /home/nanobot/.npm-global

          # --- End custom runtime additions ---

          '''

          text = text.replace(marker, additions + marker, 1)

          path.write_text(text)
          PY

          echo "========== Patched Dockerfile =========="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
