name: Build Upstream Nanobot

on:
  schedule:
    # Check latest upstream release daily at midnight UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Find latest upstream release
      # ------------------------------------------------------------

      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Checkout exact upstream release
      # ------------------------------------------------------------

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Patch upstream Dockerfile
      # ------------------------------------------------------------

      - name: Add CLI tools, Chromium and Node.js 24
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          # --------------------------------------------------------
          # Use the official Node 24 image as a source stage
          # --------------------------------------------------------

          text = "FROM node:24-bookworm-slim AS node-runtime\n\n" + text

          # --------------------------------------------------------
          # Add runtime packages
          #
          # curl          HTTP requests / weather skills
          # gh            GitHub CLI
          # chromium      Headless browser
          # ffmpeg        Video/audio processing (Hyperframes)
          # fonts         Browser rendering
          #
          # Node/npm come from the official Node stage.
          # --------------------------------------------------------

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl gh chromium ffmpeg "
              "fonts-liberation fonts-noto-color-emoji"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line changed. "
                  "Refusing to modify it automatically."
              )

          text = text.replace(original, replacement, 1)

          # --------------------------------------------------------
          # Add our runtime configuration before upstream ENTRYPOINT
          # --------------------------------------------------------

          marker = 'ENTRYPOINT ["entrypoint.sh"]'

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find upstream ENTRYPOINT."
              )

          additions = r'''
          # ========================================================
          # Custom Nanobot runtime additions
          # ========================================================

          # --------------------------------------------------------
          # Node.js 24 + npm + npx
          # --------------------------------------------------------

          COPY --from=node-runtime /usr/local/bin/node /usr/local/bin/node
          COPY --from=node-runtime /usr/local/lib/node_modules /usr/local/lib/node_modules

          RUN ln -sf ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm \
              && ln -sf ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx

          # --------------------------------------------------------
          # Headless Chromium
          # --------------------------------------------------------
          #
          # Installed from Debian packages above.
          #
          # Executable:
          #   /usr/bin/chromium
          #
          # Usage:
          #   chromium --headless --screenshot https://example.com
          #
          # CHROME_BIN is useful for applications which support it.
          #
          # Do not globally override Puppeteer's executable path:
          # Hyperframes may require its own pinned headless shell.
          #

          ENV CHROME_BIN=/usr/bin/chromium

          # --------------------------------------------------------
          # npm global package installation
          # --------------------------------------------------------
          #
          # Nanobot runs as UID 1000.
          #
          # Global npm installs must not write to:
          #   /usr/local/lib/node_modules
          #
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global

          # --------------------------------------------------------
          # npm cache and logs
          # --------------------------------------------------------
          #
          # Avoid EACCES errors writing to:
          #   /home/nanobot/.npm/_cacache
          #
          ENV NPM_CONFIG_CACHE=/home/nanobot/.npm

          # --------------------------------------------------------
          # PATH
          # --------------------------------------------------------
          #
          # Preserve upstream PATH including /app/.venv/bin.
          # This directory contains the Nanobot executable.
          #
          # Also expose executables installed by npm -g.
          #
          ENV PATH="/home/nanobot/.npm-global/bin:${PATH}"

          # --------------------------------------------------------
          # Create writable npm directories
          # --------------------------------------------------------

          RUN mkdir -p \
                  /home/nanobot/.npm-global/bin \
                  /home/nanobot/.npm-global/lib/node_modules \
                  /home/nanobot/.npm \
              && printf '%s\n' \
                  'prefix=/home/nanobot/.npm-global' \
                  'cache=/home/nanobot/.npm' \
                  > /home/nanobot/.npmrc \
              && chown -R nanobot:nanobot \
                  /home/nanobot/.npm-global \
                  /home/nanobot/.npm \
                  /home/nanobot/.npmrc

          # --------------------------------------------------------
          # Build-time sanity checks
          # --------------------------------------------------------

          RUN set -eu; \
              test -x /app/.venv/bin/nanobot; \
              command -v nanobot; \
              command -v node; \
              command -v npm; \
              command -v npx; \
              command -v curl; \
              command -v gh; \
              command -v chromium; \
              command -v ffmpeg; \
              echo "=== Nanobot ==="; \
              command -v nanobot; \
              echo "=== Node ==="; \
              node --version; \
              echo "=== npm ==="; \
              npm --version; \
              echo "=== npm prefix ==="; \
              npm config get prefix; \
              echo "=== npm cache ==="; \
              npm config get cache; \
              echo "=== Chromium ==="; \
              chromium --version; \
              echo "=== FFmpeg ==="; \
              ffmpeg -version | head -1

          # ========================================================
          # End custom Nanobot runtime additions
          # ========================================================

          '''

          text = text.replace(marker, additions + marker, 1)

          dockerfile.write_text(text)
          PY

          echo "========================================"
          echo "Patched Dockerfile"
          echo "========================================"

          cat Dockerfile

      # ------------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # GHCR login
      # ------------------------------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Image metadata
      # ------------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Build and push
      # ------------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
