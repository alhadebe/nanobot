name: Build Upstream Nanobot

on:
  schedule:
    # Check for a new stable upstream release daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Fetch latest stable release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )
          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi
          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout exact upstream release
        uses: actions/checkout@v5
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}
          persist-credentials: false

      - name: Add custom runtime tools without replacing upstream packages
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          source = dockerfile.read_text()

          # Nanobot v0.4.0 already uses Node 24 to build its WebUI.
          # Reuse this stage instead of injecting another Node FROM.
          node_stage = "FROM node:24-bookworm-slim AS webui-builder"
          if node_stage not in source:
              raise SystemExit(
                  "ERROR: Upstream Node build stage changed. "
                  "Review the current upstream Dockerfile before rebuilding."
              )

          marker = 'ENTRYPOINT ["entrypoint.sh"]'
          if source.count(marker) != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one upstream entrypoint. "
                  "Review the current upstream Dockerfile before rebuilding."
              )

          additions = r'''
          # ========================================================
          # Additional runtime tools; upstream Dockerfile preserved
          # ========================================================

          # Keep upstream's packages (including its curl) untouched.
          # Add GitHub CLI, headless Chromium, FFmpeg and rendering fonts.
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                  gh chromium ffmpeg fonts-liberation fonts-noto-color-emoji && \
              rm -rf /var/lib/apt/lists/*

          # Copy Node 24, npm and npx from upstream's existing WebUI stage.
          COPY --from=webui-builder /usr/local/bin/node /usr/local/bin/node
          COPY --from=webui-builder /usr/local/lib/node_modules /usr/local/lib/node_modules
          RUN ln -sf ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm && \
              ln -sf ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx

          # Browser auto-discovery for applications that support CHROME_BIN.
          ENV CHROME_BIN=/usr/bin/chromium

          # Keep npm global packages and cache writable by UID 1000.
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global
          ENV NPM_CONFIG_CACHE=/home/nanobot/.npm

          # Preserve the existing upstream PATH, especially /app/.venv/bin.
          ENV PATH="/home/nanobot/.npm-global/bin:${PATH}"

          RUN mkdir -p \
                  /home/nanobot/.npm-global/bin \
                  /home/nanobot/.npm-global/lib/node_modules \
                  /home/nanobot/.npm && \
              printf '%s\n' \
                  'prefix=/home/nanobot/.npm-global' \
                  'cache=/home/nanobot/.npm' \
                  > /home/nanobot/.npmrc && \
              chown -R nanobot:nanobot \
                  /home/nanobot/.npm-global \
                  /home/nanobot/.npm \
                  /home/nanobot/.npmrc

          # Abort image builds when a required tool is missing.
          RUN set -eu; \
              test -x /app/.venv/bin/nanobot; \
              for cmd in nanobot node npm npx curl gh chromium ffmpeg; do \
                  command -v "$cmd"; \
              done; \
              node --version; \
              npm --version; \
              chromium --version; \
              ffmpeg -version | head -1; \
              test "$(npm config get prefix)" = /home/nanobot/.npm-global; \
              test "$(npm config get cache)" = /home/nanobot/.npm

          # ========================================================
          # End additional runtime tools
          # ========================================================

          '''

          dockerfile.write_text(source.replace(marker, additions + marker, 1))
          PY

          echo "========================================"
          echo "Patched upstream Dockerfile"
          echo "========================================"
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
