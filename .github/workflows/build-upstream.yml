name: Build Upstream Nanobot

on:
  schedule:
    # Check for a new upstream release every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual builds
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Find latest Nanobot release
      # ------------------------------------------------------------

      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Checkout that exact upstream release
      # ------------------------------------------------------------

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Inject extra runtime tools
      # ------------------------------------------------------------

      - name: Add CLI tools to Nanobot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl nodejs npm gh"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line has changed. "
                  "Refusing to modify it automatically."
              )

          dockerfile.write_text(text.replace(original, replacement))
          PY

          echo "Patched Dockerfile:"
          grep -n "apt-get install" Dockerfile

      # ------------------------------------------------------------
      # Docker / GHCR
      # ------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
