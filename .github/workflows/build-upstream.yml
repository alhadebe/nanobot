name: Build Upstream Nanobot

on:
  schedule:
    # Check for a new upstream release every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual builds
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Find latest Nanobot release
      # ------------------------------------------------------------

      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Checkout that exact upstream release
      # ------------------------------------------------------------

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Inject extra runtime tools
      # ------------------------------------------------------------

      - name: Add CLI tools and Node.js 24 to Nanobot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          # --------------------------------------------------------
          # Add official Node.js 24 as an additional build stage.
          #
          # We intentionally do NOT install Debian's nodejs/npm
          # packages because they currently provide Node 18, which
          # is too old for packages such as Hyperframes/Puppeteer.
          # --------------------------------------------------------

          text = "FROM node:24-bookworm-slim AS node-runtime\n\n" + text

          # --------------------------------------------------------
          # Add runtime CLI tools.
          #
          # curl -> Weather and general HTTP-based skills
          # gh   -> GitHub skill
          #
          # Node/npm/npx come from node-runtime above.
          # --------------------------------------------------------

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl gh"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line has changed. "
                  "Refusing to modify it automatically."
              )

          text = text.replace(original, replacement, 1)

          # --------------------------------------------------------
          # Add Node.js 24 and configure npm for the unprivileged
          # Nanobot user.
          #
          # Nanobot's CLI app installer runs:
          #
          #     npm install -g <package>
          #
          # Global npm packages therefore need a location writable
          # by UID 1000 rather than /usr/local/lib/node_modules.
          #
          # .npmrc is intentionally created as well as setting the
          # environment variable so npm still sees the correct
          # prefix if Nanobot sanitises subprocess environment vars.
          # --------------------------------------------------------

          marker = "ENTRYPOINT"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find ENTRYPOINT in upstream Dockerfile. "
                  "Refusing to modify it automatically."
              )

          additions = r'''
          # --------------------------------------------------------
          # Custom Nanobot runtime tools
          # --------------------------------------------------------

          # Node.js 24 + npm + npx
          COPY --from=node-runtime /usr/local/ /usr/local/

          # Install global npm packages into Nanobot's home directory
          # instead of root-owned /usr/local/lib/node_modules.
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global

          # Make executables installed by npm globally available.
          ENV PATH="/home/nanobot/.npm-global/bin:/usr/local/bin:/usr/bin:/bin"

          # Create Nanobot's npm directories and persistent npm config.
          RUN mkdir -p /home/nanobot/.npm-global/bin \
              /home/nanobot/.npm-global/lib/node_modules \
              && printf 'prefix=/home/nanobot/.npm-global\n' \
                  > /home/nanobot/.npmrc \
              && chown -R nanobot:nanobot \
                  /home/nanobot/.npm-global \
                  /home/nanobot/.npmrc

          # --------------------------------------------------------
          # End custom Nanobot runtime tools
          # --------------------------------------------------------

          '''

          text = text.replace(marker, additions + marker, 1)

          dockerfile.write_text(text)
          PY

          echo "========================================"
          echo "Patched Dockerfile"
          echo "========================================"
          cat Dockerfile

      # ------------------------------------------------------------
      # Docker / GHCR
      # ------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Build and push
      # ------------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
