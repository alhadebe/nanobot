name: Build Upstream Nanobot

on:
  schedule:
    # Check for a new upstream release every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual builds
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Find latest Nanobot release
      # ------------------------------------------------------------

      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Checkout exact upstream release
      # ------------------------------------------------------------

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Inject extra runtime tools
      # ------------------------------------------------------------

      - name: Add CLI tools and Node.js 24 to Nanobot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          # --------------------------------------------------------
          # Add a Node.js 24 source stage.
          # --------------------------------------------------------

          text = "FROM node:24-bookworm-slim AS node-runtime\n\n" + text

          # --------------------------------------------------------
          # Add curl + GitHub CLI to the final runtime image.
          #
          # Node/npm are deliberately NOT installed from Debian,
          # because Debian's packaged Node version may be too old
          # for current Nanobot CLI apps.
          # --------------------------------------------------------

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl gh"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line has changed. "
                  "Refusing to modify automatically."
              )

          text = text.replace(original, replacement, 1)

          # --------------------------------------------------------
          # Insert our runtime additions immediately before
          # upstream ENTRYPOINT.
          # --------------------------------------------------------

          marker = 'ENTRYPOINT ["entrypoint.sh"]'

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find upstream ENTRYPOINT. "
                  "Refusing to modify automatically."
              )

          additions = r'''
          # --------------------------------------------------------
          # Custom Nanobot runtime tools
          # --------------------------------------------------------

          # Node.js 24 + npm + npx
          COPY --from=node-runtime /usr/local/ /usr/local/

          # --------------------------------------------------------
          # npm configuration
          # --------------------------------------------------------
          #
          # Nanobot runs as UID 1000 after entrypoint initialization.
          # Global npm installs must therefore NOT target:
          #
          #   /usr/local/lib/node_modules
          #
          # Instead use a user-writable global package directory.
          #
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global

          # IMPORTANT:
          #
          # Preserve /app/.venv/bin.
          #
          # Nanobot itself is installed here and upstream's
          # entrypoint executes "nanobot" after dropping privileges.
          #
          ENV PATH="/home/nanobot/.npm-global/bin:/app/.venv/bin:/usr/local/bin:/usr/bin:/bin"

          # Create npm global directory and also configure ~/.npmrc.
          #
          # ~/.npmrc provides a second layer of protection in case
          # an npm subprocess does not inherit NPM_CONFIG_PREFIX.
          #
          RUN mkdir -p \
                  /home/nanobot/.npm-global/bin \
                  /home/nanobot/.npm-global/lib/node_modules \
              && printf 'prefix=/home/nanobot/.npm-global\n' \
                  > /home/nanobot/.npmrc \
              && chown -R nanobot:nanobot \
                  /home/nanobot/.npm-global \
                  /home/nanobot/.npmrc

          # --------------------------------------------------------
          # Build-time sanity checks
          # --------------------------------------------------------

          RUN test -x /app/.venv/bin/nanobot \
              && command -v nanobot \
              && command -v node \
              && command -v npm \
              && command -v npx \
              && command -v curl \
              && command -v gh \
              && node --version \
              && npm --version \
              && npm config get prefix

          # --------------------------------------------------------
          # End custom Nanobot runtime tools
          # --------------------------------------------------------

          '''

          text = text.replace(marker, additions + marker, 1)

          dockerfile.write_text(text)
          PY

          echo
          echo "========================================"
          echo "Patched Dockerfile"
          echo "========================================"
          cat Dockerfile

      # ------------------------------------------------------------
      # Docker / GHCR
      # ------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Build + push
      # ------------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
