name: Build Upstream Nanobot

on:
  schedule:
    # Check for a new upstream release every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual builds
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ------------------------------------------------------------
      # Find latest Nanobot release
      # ------------------------------------------------------------

      - name: Fetch latest release tag from upstream
        id: get_release
        shell: bash
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -fsSL \
              https://api.github.com/repos/HKUDS/nanobot/releases/latest |
              jq -r '.tag_name'
          )

          if [ "$LATEST_TAG" = "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Error fetching upstream release tag"
            exit 1
          fi

          echo "Latest upstream tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Checkout that exact upstream release
      # ------------------------------------------------------------

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: HKUDS/nanobot
          ref: ${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Inject extra runtime tools
      # ------------------------------------------------------------

      - name: Add CLI tools and Node.js 24 to Nanobot image
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          text = dockerfile.read_text()

          # --------------------------------------------------------
          # Add official Node.js 24 image as a build stage.
          # This gives us a modern Node/npm/npx instead of Debian's
          # older Node.js package.
          # --------------------------------------------------------

          text = "FROM node:24-bookworm-slim AS node-runtime\n\n" + text

          # --------------------------------------------------------
          # Add curl + GitHub CLI to Nanobot's runtime packages.
          # Do NOT install Debian's nodejs/npm packages.
          # --------------------------------------------------------

          original = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1"
          )

          replacement = (
              "apt-get install -y --no-install-recommends "
              "ca-certificates git bubblewrap openssh-client libmagic1 "
              "curl gh"
          )

          if original not in text:
              raise SystemExit(
                  "ERROR: Upstream Dockerfile package line has changed. "
                  "Refusing to modify it automatically."
              )

          text = text.replace(original, replacement, 1)

          # --------------------------------------------------------
          # Copy Node.js 24 + npm/npx into the final Nanobot image.
          #
          # Configure npm global installs to use a directory owned by
          # the unprivileged nanobot user instead of:
          #
          #   /usr/local/lib/node_modules
          #
          # This allows Nanobot/ClawHub to install npm-based apps
          # without running Nanobot as root.
          # --------------------------------------------------------

          marker = "ENTRYPOINT"

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find ENTRYPOINT in upstream Dockerfile. "
                  "Refusing to modify it automatically."
              )

          additions = r'''
          # --------------------------------------------------------
          # Custom Nanobot runtime tools
          # --------------------------------------------------------

          # Node.js 24 + npm + npx
          COPY --from=node-runtime /usr/local/ /usr/local/

          # User-writable location for global npm packages
          ENV NPM_CONFIG_PREFIX=/home/nanobot/.npm-global
          ENV PATH="/home/nanobot/.npm-global/bin:${PATH}"

          RUN mkdir -p /home/nanobot/.npm-global \
              && chown -R nanobot:nanobot /home/nanobot/.npm-global

          # --------------------------------------------------------
          # End custom runtime tools
          # --------------------------------------------------------

          '''

          text = text.replace(marker, additions + marker, 1)

          dockerfile.write_text(text)
          PY

          echo "========================================"
          echo "Patched Dockerfile"
          echo "========================================"
          cat Dockerfile

      # ------------------------------------------------------------
      # Docker / GHCR
      # ------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.get_release.outputs.tag }}

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
